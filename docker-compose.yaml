version: '3.8'

services:

  # init_service:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.init
  #   container_name: init_service
  #   networks:
  #     - my_network
  #   environment:
  #     - QDRANT_HOST=qdrant_service
  #     - QDRANT_PORT=6333
  #   depends_on:
  #     - qdrant_service
  
  backend_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_service
    networks:
      - my_network
    environment:
      - QDRANT_HOST=qdrant_service
      - QDRANT_PORT=6333
    depends_on:
      - qdrant_service

  qdrant_service:
    image: qdrant/qdrant
    container_name: qdrant_service
    networks:
      - my_network
    ports:
      - "6333:6333"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx  
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - my_network
    depends_on:
      - backend_service

networks:
  my_network:
    driver: bridge