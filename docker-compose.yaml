version: '3.8'

services:
  backend_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_service
    networks:
      - my_network
    environment:
      - QDRANT_HOST=qdrant_service
      - QDRANT_PORT=6333
    depends_on:
      - qdrant_service

  qdrant_service:
    image: qdrant/qdrant
    container_name: qdrant_service
    networks:
      - my_network
    volumes:
      - ./qdrant_storage:/qdrant/storage

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx  
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - my_network
    depends_on:
      - backend_service

networks:
  my_network:
    driver: bridge